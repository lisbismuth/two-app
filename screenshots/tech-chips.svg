<svg xmlns="http://www.w3.org/2000/svg" width="420" height="28" viewBox="0 0 420 28" role="img" aria-label="MIT · React 19 · TypeScript 5.7 · Vite 8">
  <style>
    .chip { fill: #F3F1EC; }
    .label { fill: #52525b; }
    .pill { fill: #1a1a1a; }
    .pill-text { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .chip { fill: #3f3f46; }
      .label { fill: #e4e4e7; }
      .pill { fill: #fafafa; }
      .pill-text { fill: #18181b; }
    }
  </style>
  <!-- license MIT -->
  <g transform="translate(0,0)">
    <rect class="chip" width="78" height="28" rx="8" ry="8"/>
    <text class="label" x="10" y="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">license</text>
    <rect class="pill" x="52" y="4" width="22" height="20" rx="5" ry="5"/>
    <text class="pill-text" x="63" y="18" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">MIT</text>
  </g>
  <!-- React 19 -->
  <g transform="translate(90,0)">
    <rect class="chip" width="78" height="28" rx="8" ry="8"/>
    <text class="label" x="10" y="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">React</text>
    <rect class="pill" x="50" y="4" width="24" height="20" rx="5" ry="5"/>
    <text class="pill-text" x="62" y="18" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">19</text>
  </g>
  <!-- TypeScript 5.7 -->
  <g transform="translate(180,0)">
    <rect class="chip" width="118" height="28" rx="8" ry="8"/>
    <text class="label" x="10" y="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">TypeScript</text>
    <rect class="pill" x="82" y="4" width="30" height="20" rx="5" ry="5"/>
    <text class="pill-text" x="97" y="18" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">5.7</text>
  </g>
  <!-- Vite 8 -->
  <g transform="translate(310,0)">
    <rect class="chip" width="70" height="28" rx="8" ry="8"/>
    <text class="label" x="10" y="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Vite</text>
    <rect class="pill" x="42" y="4" width="22" height="20" rx="5" ry="5"/>
    <text class="pill-text" x="53" y="18" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">8</text>
  </g>
</svg>
