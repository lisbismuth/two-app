<svg xmlns="http://www.w3.org/2000/svg" width="640" height="168" viewBox="0 0 640 168" role="img" aria-label="Демо-режим · Guest Mode">
  <style>
    .card { fill: #F7F5F1; stroke: #E8E4DC; }
    .title { fill: #18181b; }
    .body { fill: #3f3f46; }
    .muted { fill: #52525b; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #27272a; stroke: #3f3f46; }
      .title { fill: #fafafa; }
      .body { fill: #d4d4d8; }
      .muted { fill: #a1a1aa; }
    }
  </style>
  <rect class="card" width="640" height="168" rx="16" ry="16" stroke-width="1"/>
  <text class="title" x="28" y="40" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700">Демо-режим · Guest Mode</text>
  <text class="body" x="28" y="72" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Нажмите кнопку выше или откройте приложение с параметром</text>
  <text class="body" x="28" y="94" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">?demo=true / ?guest=true — данные пары Ани и Игоря (задачи, траты, хотелки).</text>
  <text class="muted" x="28" y="132" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">Только просмотр · без записи на сервер · локальный snapshot</text>
</svg>
